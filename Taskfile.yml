---
version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Lint all markdown files
    cmds:
      - markdownlint '**/*.md' --ignore node_modules

  lint:fix:
    desc: Lint and auto-fix all markdown files
    cmds:
      - markdownlint '**/*.md' --ignore node_modules --fix

  format:
    desc: Format all markdown files
    cmds:
      - npm run format

  format:check:
    desc: Check formatting of all markdown files
    cmds:
      - npm run format:check
