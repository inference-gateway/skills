---
version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Lint all markdown files
    cmds:
      - markdownlint '**/*.md'

  lint:fix:
    desc: Lint and auto-fix all markdown files
    cmds:
      - markdownlint '**/*.md' --fix

  format:
    desc: Format all markdown files
    cmds:
      - bun run format

  format:check:
    desc: Check formatting of all markdown files
    cmds:
      - bun run format:check

  scan:
    desc: Security-scan catalog skills with SkillSpector (warn-only; see docs/security-scanning.md)
    cmds:
      - bun run scan

  build:
    desc: Regenerate catalog.json from skills/ + skills.yaml
    cmds:
      - bun run build

  serve:
    desc: Serve catalog.json locally at http://localhost:8787/skills/
    cmds:
      - bun run serve
