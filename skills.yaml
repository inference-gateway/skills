# Source list for every Agent Skill aggregated into catalog.json.
#
# `catalog.json` (served from
#   https://cdn.jsdelivr.net/gh/inference-gateway/skills@<tag>/catalog.json)
# is generated by `scripts/build-catalog.mjs` from this file. Every skill -
# whether its body lives in this repo or in another GitHub repo - gets one
# entry below. There is no implicit directory walk and no sidecar metadata
# file; this list is the single source of truth.
#
# When `url` points at `https://github.com/inference-gateway/skills` (this
# repo), the build script reads `path` from the local working tree instead
# of fetching from raw.githubusercontent.com, so PRs that add a new local
# skill build correctly before the branch is merged to `main`.
#
# Entry fields:
#
#   url        (required) Full https://github.com/<owner>/<repo> URL.
#   ref        (optional) Branch, tag, or commit SHA. Default: main.
#                         Ignored for entries pointing at this repo (the
#                         working tree is always the source of truth).
#                         Pinning a release tag is STRONGLY recommended for
#                         third-party skills so upstream changes can't break
#                         the catalog mid-cycle.
#   path       (optional) Path to the SKILL.md within the repo, relative to
#                         the repo root. Default: `SKILL.md`. Required for
#                         multi-skill repos (including this one - e.g.
#                         `skills/foo/SKILL.md`).
#   vendor     (required) Vendor / org name shown in the registry UI.
#   license    (optional) SPDX identifier. If absent, the build script reads
#                         it from the upstream SKILL.md frontmatter. Must be
#                         one of the ADL Skill license enum values (see
#                         scripts/build-catalog.mjs).
#   tags       (required) Discoverability tags, string array.
#   categories (required) Catalog categories, string array.
#   homepage   (optional) URL to the upstream project page.
#   language   (optional) Programming language the skill targets, e.g. `go`.
#                         Adds `language` + `logo` (devicon SVG URL) to the
#                         catalog entry so the registry UI can show a language
#                         badge. Inferred from `tags` when a tag matches a
#                         known language; omit both for language-agnostic
#                         skills and no logo is emitted. Allowed values: see
#                         LANGUAGE_ICONS in scripts/build-catalog.mjs.
#
# Validation rules (enforced by scripts/build-catalog.mjs):
#
#   * `name` from frontmatter must be unique across all entries.
#   * `description` must be 1-1024 chars (Agent Skills spec).
#   * `license` must be in the ADL Skill enum.
#   * Any fetch / parse / validation failure aborts the catalog write -
#     we never publish a partial catalog.
#
# Third-party contributions are welcome. Open a PR adding one entry below.

skills:
