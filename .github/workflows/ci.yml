---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install markdownlint
        run: bun install -g markdownlint-cli@0.48.0

      - name: Run markdownlint
        run: markdownlint '**/*.md'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier '**/*.md' --check

      # Keeps catalog.json in the same commit as the skill it describes, so any
      # release tag is self-consistent. Without this the rebuild lands in a
      # follow-up chore commit that never triggers a release, and @latest serves
      # a catalog missing the newest skills.
      - name: Check catalog.json is up to date
        run: |
          bun run build
          if ! git diff --exit-code catalog.json; then
            echo "::error::catalog.json is stale. Run 'bun run build' and commit the result."
            exit 1
          fi
