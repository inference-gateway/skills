---
name: Build catalog

on:
  push:
    branches:
      - main
    paths:
      - 'skills.yaml'
      - 'skills/**'
      - 'scripts/build-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-catalog.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: 'chore(catalog): Rebuild catalog.json'
          title: 'chore(catalog): Rebuild catalog.json'
          body: |
            Automated rebuild of `catalog.json` from `skills.yaml` + `skills/**`.
          branch: chore/rebuild-catalog
          delete-branch: true
          add-paths: catalog.json
          sign-commits: true
