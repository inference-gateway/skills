---
name: Build catalog

on:
  push:
    branches:
      - main
    paths:
      - 'skills.yaml'
      - 'skills/**'
      - 'scripts/build-catalog.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-catalog.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: 'chore(catalog): Rebuild catalog.json'
          title: 'chore(catalog): Rebuild catalog.json'
          body: |
            Automated rebuild of `catalog.json` from `skills.yaml` + `skills/**`.
          branch: chore/rebuild-catalog
          delete-branch: true
          add-paths: catalog.json
          sign-commits: true
